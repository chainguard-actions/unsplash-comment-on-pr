name: Test multi-word message input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake push event payload
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.test-events"
          cat > "$GITHUB_WORKSPACE/.test-events/push-multiword.json" <<'EOF'
          {
            "after": "abc123def456abc123def456abc123def456abc123",
            "repository": {
              "full_name": "actionchain-harness/test-repo"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /github/workspace/.test-events/push-multiword.json
        with:
          msg: "Database migration required: please run migrations before deploying"

      - name: Assert action ran and failed gracefully (sentinel repo not resolvable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail because the sentinel repo doesn't exist on GitHub.
          # This is expected behavior under the harness.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
