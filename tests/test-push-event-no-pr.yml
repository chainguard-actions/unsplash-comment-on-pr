name: Test comment-on-pr with push event and no matching PR
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake push event JSON
        run: |
          mkdir -p /tmp/fake-event
          cat > /tmp/fake-event/event.json <<'EOF'
          {
            "after": "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef",
            "repository": {
              "full_name": "actionchain-harness/test-repo"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/fake-event/event.json
          GITHUB_EVENT_NAME: push
        with:
          msg: "Test comment from push event"

      - name: Assert action fails gracefully (no matching PR or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # For a push event, the action tries to list open PRs via the GitHub API.
          # With the sentinel repo, the API call will fail (404), OR if it somehow
          # succeeds, no PR will match the fake SHA, so the action exits with an error.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (sentinel repo or no matching PR)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with a fake SHA and sentinel repo"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
