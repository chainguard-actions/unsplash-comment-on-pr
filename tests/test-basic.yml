name: Test basic usage - comment on PR
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          msg: "Test comment from CI"
          check_for_duplicate_msg: "false"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may fail without real GitHub token/PR)"
          echo "PASS: msg input was accepted"
